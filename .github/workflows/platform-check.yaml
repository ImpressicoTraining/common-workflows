
name: Platform Integration Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  platform-check:
    name: Verify reusable workflow access
    runs-on: ubuntu-latest

    steps:
      - name: Confirm caller information
        run: |
          echo "Reusable workflow executed successfully."
          echo "Caller repository: $GITHUB_REPOSITORY"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Branch or tag: $GITHUB_REF"

      - name: Validate execution context
        run: |
          test -n "$GITHUB_REPOSITORY"
          test -n "$GITHUB_SHA"
          echo "Platform integration check passed."
