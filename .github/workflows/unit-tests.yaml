name: Unit Tests and Coverage

on:
  workflow_call:
    inputs:
      application:
        description: Application name
        required: true
        type: string

      setup_command:
        description: Install dependencies
        required: true
        type: string

      test_command:
        description: Execute unit tests with coverage
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests - ${{ inputs.application }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        if: inputs.application == 'Django'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        if: inputs.application == 'React-Node'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        env:
          SETUP_COMMAND: ${{ inputs.setup_command }}
        run: |
          set -euo pipefail
          bash -e -o pipefail -c "$SETUP_COMMAND"

      - name: Run unit tests and generate coverage report
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: |
          set -euo pipefail
          bash -e -o pipefail -c "$TEST_COMMAND"
          
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.application }}-coverage-report
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: ignore
          retention-days: 7
          
