
name: Allow To Merge

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-commit-messages:
    name: Validate JIRA commit messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request commits
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate commit message format
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "Starting commit message validation..."

          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "::error::Missing pull request commit information."
            exit 1
          fi

          mapfile -t commits < <(
            git log --no-merges --format='%s' "${BASE_SHA}..${HEAD_SHA}"
          )

          if [[ ${#commits[@]} -eq 0 ]]; then
            echo "::error::No commits found in the pull request."
            exit 1
          fi

          echo "Total commits to validate: ${#commits[@]}"

          failed=0

          for message in "${commits[@]}"; do
            echo "----------------------------------------"
            echo "Checking commit: $message"

            if [[ "$message" =~ ^DEVOPS-[0-9]+:[[:space:]]+.+$ ]]; then
              echo "PASS: Valid commit message."
            else
              echo "::error::FAIL: Invalid commit message: $message"
              echo "Required format: DEVOPS-123: Your commit description"
              failed=1
            fi
          done

          echo "----------------------------------------"

          if [[ "$failed" -ne 0 ]]; then
            echo "::error::One or more commit messages are invalid."
            exit 1
          fi

          echo "SUCCESS: All commit messages passed validation."
