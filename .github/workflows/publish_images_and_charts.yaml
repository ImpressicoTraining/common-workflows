
name: Publish Docker Image and Helm Chart

on:
  workflow_call:
    inputs:
      artifact_run_id:
        description: Main workflow run ID containing the Docker image artifact
        required: true
        type: string

      artifact_name:
        description: Docker image artifact name
        required: true
        type: string

      source_sha:
        description: Application commit SHA used to build the Docker image
        required: true
        type: string

      version:
        description: Version to publish
        required: true
        type: string

      local_image_name:
        description: Local Docker image name
        required: true
        type: string

      ghcr_image:
        description: Target GHCR image name
        required: true
        type: string

      chart_path:
        description: Path to Helm chart directory
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

jobs:

  # --------------------------------------------------
  # 1. Download Docker image artifact
  # --------------------------------------------------

  download-image:
    name: Download Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: image-artifact
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloaded image archive
        shell: bash
        run: |
          set -euo pipefail

          test -f image-artifact/image.tar

          echo "Docker image artifact downloaded successfully."

      - name: Upload image for publishing job
        uses: actions/upload-artifact@v4
        with:
          name: image-for-publishing
          path: image-artifact/image.tar
          retention-days: 1

  # --------------------------------------------------
  # 2. Load and publish Docker image
  # --------------------------------------------------

  publish-image:
    name: Publish Docker Image to GHCR
    needs: download-image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download image for publishing
        uses: actions/download-artifact@v4
        with:
          name: image-for-publishing
          path: image-artifact

      - name: Checkout common workflows
        uses: actions/checkout@v4
        with:
          repository: ImpressicoTraining/common-workflows
          ref: main
          path: common-workflows

      - name: Publish Docker image
        id: push-image
        shell: bash
        env:
          IMAGE_TAR: image-artifact/image.tar
          LOCAL_IMAGE: ${{ inputs.local_image_name }}
          GHCR_IMAGE: ${{ inputs.ghcr_image }}
          VERSION: ${{ inputs.version }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          bash common-workflows/scripts/publish_images.sh

      # --------------------------------------------------
      # 3. Sign image using Cosign
      # --------------------------------------------------

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign Docker image
        shell: bash
        env:
          GHCR_IMAGE: ${{ inputs.ghcr_image }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail

          cosign sign --yes "$GHCR_IMAGE@$DIGEST"

      # --------------------------------------------------
      # 4. Verify Cosign signature
      # --------------------------------------------------

      - name: Verify Cosign signature
        shell: bash
        env:
          GHCR_IMAGE: ${{ inputs.ghcr_image }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail

          cosign verify "$GHCR_IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/ImpressicoTraining/common-workflows/.github/workflows/publish_images_and_charts.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

          echo "Cosign signature verification successful."

      - name: Image publishing summary
        shell: bash
        env:
          GHCR_IMAGE: ${{ inputs.ghcr_image }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          {
            echo "## Docker Image Publishing"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | $GHCR_IMAGE |"
            echo "| Version | $VERSION |"
            echo "| Digest | $DIGEST |"
            echo "| Signature | Verified |"
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------
  # 5. Package Helm chart
  # --------------------------------------------------

  package-chart:
    name: Package Helm Chart
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Checkout common workflows
        uses: actions/checkout@v4
        with:
          repository: ImpressicoTraining/common-workflows
          ref: main
          path: common-workflows

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint and package Helm chart
        shell: bash
        env:
          CHART_PATH: ${{ inputs.chart_path }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          bash common-workflows/scripts/publish_Charts.sh package

      - name: Upload packaged Helm chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: chart-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------
  # 6. Chart validation placeholder
  # --------------------------------------------------

  chart-validation:
    name: Chart Validation
    needs: package-chart
    runs-on: ubuntu-latest

    steps:
      - name: Chart validation placeholder
        shell: bash
        run: |
          echo "Chart validation stage."
          echo "Future implementation:"
          echo "1. Deploy chart to Kubernetes test namespace."
          echo "2. Verify deployment and pods."
          echo "3. Verify services and endpoints."
          echo "4. Execute application smoke tests."
          echo "Chart validation placeholder completed."

  # --------------------------------------------------
  # 7. Publish Helm chart to GHCR OCI
  # --------------------------------------------------

  publish-chart:
    name: Publish Helm Chart to GHCR
    needs:
      - package-chart
      - chart-validation
      - publish-image

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download packaged Helm chart
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: chart-package

      - name: Checkout common workflows
        uses: actions/checkout@v4
        with:
          repository: ImpressicoTraining/common-workflows
          ref: main
          path: common-workflows

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Publish Helm chart to GHCR
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_PACKAGE: chart-package
        run: |
          set -euo pipefail

          bash common-workflows/scripts/publish_Charts.sh publish

      - name: Helm chart publishing summary
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Helm Chart Publishing"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Registry | ghcr.io |"
            echo "| Chart version | $VERSION |"
            echo "| OCI repository | ghcr.io/impressicotraining/charts |"
            echo "| Status | Published |"
          } >> "$GITHUB_STEP_SUMMARY"
