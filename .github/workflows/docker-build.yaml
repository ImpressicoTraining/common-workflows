
name: Docker Image Build

on:
  workflow_call:
    inputs:
      application:
        description: "Application to build: django, frontend, or backend"
        required: true
        type: string

      image_name:
        description: "Local Docker image name"
        required: true
        type: string

      image_tag:
        description: "Docker image tag"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker-build:
    name: Build, Scan and Sign ${{ inputs.application }} image
    runs-on: ubuntu-latest

    env:
      TRIVY_VERSION: v0.76.2
      GRYPE_VERSION: v0.121.3

    steps:
      # --------------------------------------------------
      # 1. Checkout application repository
      # --------------------------------------------------

      - name: Checkout application repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Checkout centralized security scripts
      # --------------------------------------------------

      - name: Checkout common-workflows security scripts
        uses: actions/checkout@v4
        with:
          repository: ImpressicoTraining/common-workflows
          ref: main
          path: common-workflows
          persist-credentials: false

      # --------------------------------------------------
      # 3. Install or restore Trivy
      # --------------------------------------------------

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      # --------------------------------------------------
      # 4. Cache Grype binary
      # --------------------------------------------------

      - name: Cache Grype binary
        id: grype-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/grype-bin
          key: grype-${{ runner.os }}-${{ runner.arch }}-${{ env.GRYPE_VERSION }}

      # --------------------------------------------------
      # 5. Install Grype only on cache miss
      # --------------------------------------------------

      - name: Install Grype
        if: steps.grype-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/grype-bin"

          curl -sSfL https://get.anchore.io/grype \
            | sh -s -- -b "$RUNNER_TEMP/grype-bin" "$GRYPE_VERSION"

      # --------------------------------------------------
      # 6. Add Grype to PATH
      # --------------------------------------------------

      - name: Add Grype to PATH
        shell: bash
        run: |
          echo "$RUNNER_TEMP/grype-bin" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # 7. Verify security tools
      # --------------------------------------------------

      - name: Verify security tools
        id: verify-tools
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Trivy..."
          trivy version

          echo "Checking Grype..."
          grype version

      # --------------------------------------------------
      # 8. Install Cosign for keyless signing
      # --------------------------------------------------

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      # --------------------------------------------------
      # 9. Verify Cosign installation
      # --------------------------------------------------

      - name: Verify Cosign installation
        run: cosign version

      # --------------------------------------------------
      # 10. Validate build inputs
      # --------------------------------------------------

      - name: Validate build inputs
        shell: bash
        env:
          APPLICATION: ${{ inputs.application }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          case "$APPLICATION" in
            django|frontend|backend)
              echo "Building application: $APPLICATION"
              ;;
            *)
              echo "Unsupported application: $APPLICATION"
              exit 1
              ;;
          esac

          if [[ ! "$IMAGE_NAME" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "Invalid image name: $IMAGE_NAME"
            exit 1
          fi

          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]]; then
            echo "Invalid image tag: $IMAGE_TAG"
            exit 1
          fi

      # --------------------------------------------------
      # 11. Prepare Docker build context
      # --------------------------------------------------

      - name: Prepare Docker build context
        id: context
        shell: bash
        env:
          APPLICATION: ${{ inputs.application }}
        run: |
          set -euo pipefail

          if [[ "$APPLICATION" == "django" ]]; then
            echo "path=." >> "$GITHUB_OUTPUT"
            echo "dockerfile=./Dockerfile" >> "$GITHUB_OUTPUT"

            test -f Dockerfile
            test -f pyproject.toml
            test -f uv.lock

          else
            CONTEXT="$RUNNER_TEMP/react-node-build-context"

            mkdir -p "$CONTEXT"

            rsync -a \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='dist' \
              --exclude='coverage' \
              ./ "$CONTEXT/"

            test -f "$CONTEXT/package.json"
            test -f "$CONTEXT/package-lock.json"

            if [[ "$APPLICATION" == "frontend" ]]; then
              test -f "$CONTEXT/frontend/Dockerfile"
              test -f "$CONTEXT/frontend/package.json"

              export BUILD_TARGET=frontend
              echo "dockerfile=$CONTEXT/frontend/Dockerfile" >> "$GITHUB_OUTPUT"

            else
              test -f "$CONTEXT/backend/Dockerfile"
              test -f "$CONTEXT/backend/package.json"

              export BUILD_TARGET=backend
              echo "dockerfile=$CONTEXT/backend/Dockerfile" >> "$GITHUB_OUTPUT"
            fi

            node <<'NODE'
          const fs = require('fs');

          const packagePath = process.env.RUNNER_TEMP +
            '/react-node-build-context/package.json';

          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));

          if (process.env.BUILD_TARGET === 'frontend') {
            pkg.scripts.build =
              'npm run build --workspace=frontend && rm -rf dist && cp -a frontend/dist dist';
          } else {
            pkg.scripts.build =
              'npm run build --workspace=backend && rm -rf dist && cp -a backend/dist dist';
          }

          fs.writeFileSync(
            packagePath,
            JSON.stringify(pkg, null, 2) + '\n'
          );
          NODE

            echo "path=$CONTEXT" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------
      # 12. Set up Docker Buildx
      # --------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # 13. Build Docker image
      # --------------------------------------------------

      - name: Build Docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.context.outputs.path }}
          file: ${{ steps.context.outputs.dockerfile }}
          push: false
          load: true
          tags: ${{ inputs.image_name }}:${{ inputs.image_tag }}
          cache-from: type=gha,scope=${{ inputs.application }}
          cache-to: type=gha,mode=max,scope=${{ inputs.application }}

      # --------------------------------------------------
      # 14. Verify Docker image
      # --------------------------------------------------

      - name: Verify Docker image
        id: verify-image
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          IMAGE="$IMAGE_NAME:$IMAGE_TAG"

          docker image inspect "$IMAGE"

          echo "Docker image successfully built:"
          docker image ls "$IMAGE"

      # --------------------------------------------------
      # 15. Run Trivy security scan
      # --------------------------------------------------

      - name: Run Trivy scan
        id: trivy-scan
        continue-on-error: true
        if: ${{ !cancelled() && steps.verify-image.outcome == 'success' && steps.verify-tools.outcome == 'success' }}
        shell: bash
        env:
          IMAGE: ${{ inputs.image_name }}:${{ inputs.image_tag }}
        run: |
          bash common-workflows/scripts/trivy.sh \
            "$IMAGE" security-reports

      # --------------------------------------------------
      # 16. Run Grype security scan
      # --------------------------------------------------

      - name: Run Grype scan
        id: grype-scan
        continue-on-error: true
        if: ${{ !cancelled() && steps.verify-image.outcome == 'success' && steps.verify-tools.outcome == 'success' }}
        shell: bash
        env:
          IMAGE: ${{ inputs.image_name }}:${{ inputs.image_tag }}
        run: |
          bash common-workflows/scripts/grype.sh \
            "$IMAGE" security-reports

      # --------------------------------------------------
      # 17. Upload security reports
      # --------------------------------------------------

      - name: Upload security scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.application }}-security-reports
          path: security-reports/
          if-no-files-found: warn
          retention-days: 30

      # --------------------------------------------------
      # 18. Login to GitHub Container Registry
      # Only on push to main
      # --------------------------------------------------

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 19. Push existing local image to GHCR
      # No rebuild takes place here
      # --------------------------------------------------

      - name: Push Docker image to GHCR
        id: push-ghcr
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          LOCAL_IMAGE: ${{ inputs.image_name }}:${{ inputs.image_tag }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          IMAGE_BASENAME="${IMAGE_NAME##*/}"
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_BASENAME,,}"

          echo "Pushing image to GHCR: $GHCR_IMAGE:$IMAGE_TAG"

          docker tag "$LOCAL_IMAGE" "$GHCR_IMAGE:$IMAGE_TAG"

          docker push "$GHCR_IMAGE:$IMAGE_TAG" \
            2>&1 | tee "$RUNNER_TEMP/ghcr-push.log"

          DIGEST="$(grep -oE 'digest: sha256:[a-f0-9]{64}' \
            "$RUNNER_TEMP/ghcr-push.log" | awk '{print $2}' | tail -n 1)"

          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not extract image digest from GHCR push."
            exit 1
          fi

          echo "image=$GHCR_IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

          echo "Published image: $GHCR_IMAGE@$DIGEST"

      # --------------------------------------------------
      # 20. Sign image using keyless Cosign
      # --------------------------------------------------

      - name: Sign Docker image with Cosign
        id: sign-image
        if: ${{ steps.push-ghcr.outcome == 'success' }}
        shell: bash
        env:
          IMAGE: ${{ steps.push-ghcr.outputs.image }}
          DIGEST: ${{ steps.push-ghcr.outputs.digest }}
        run: |
          set -euo pipefail

          echo "Signing image: $IMAGE@$DIGEST"

          cosign sign --yes "$IMAGE@$DIGEST"

      # --------------------------------------------------
      # 21. Verify Cosign signature
      # --------------------------------------------------

      - name: Verify Cosign signature
        id: verify-signature
        if: ${{ steps.sign-image.outcome == 'success' }}
        shell: bash
        env:
          IMAGE: ${{ steps.push-ghcr.outputs.image }}
          DIGEST: ${{ steps.push-ghcr.outputs.digest }}
        run: |
          set -euo pipefail

          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/ImpressicoTraining/common-workflows/.github/workflows/docker-build.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-trigger "push"

          echo "Cosign signature verification successful."

      # --------------------------------------------------
      # 22. Build and security summary
      # --------------------------------------------------

      - name: Build and security summary
        if: always()
        shell: bash
        env:
          APPLICATION: ${{ inputs.application }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          BUILD_STATUS: ${{ steps.build-image.outcome }}
          VERIFY_STATUS: ${{ steps.verify-image.outcome }}
          TRIVY_STATUS: ${{ steps.trivy-scan.outcome }}
          GRYPE_STATUS: ${{ steps.grype-scan.outcome }}
          PUSH_STATUS: ${{ steps.push-ghcr.outcome }}
          SIGN_STATUS: ${{ steps.sign-image.outcome }}
          COSIGN_VERIFY_STATUS: ${{ steps.verify-signature.outcome }}
        run: |
          {
            echo "## Docker Build, Security and Signing Summary"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Application | $APPLICATION |"
            echo "| Local image | $IMAGE_NAME:$IMAGE_TAG |"
            echo "| Docker build | ${BUILD_STATUS:-not-run} |"
            echo "| Image verification | ${VERIFY_STATUS:-not-run} |"
            echo "| Trivy scan | ${TRIVY_STATUS:-not-run} |"
            echo "| Grype scan | ${GRYPE_STATUS:-not-run} |"
            echo "| GHCR push | ${PUSH_STATUS:-not-run} |"
            echo "| Cosign signing | ${SIGN_STATUS:-not-run} |"
            echo "| Cosign verification | ${COSIGN_VERIFY_STATUS:-not-run} |"
          } >> "$GITHUB_STEP_SUMMARY"
